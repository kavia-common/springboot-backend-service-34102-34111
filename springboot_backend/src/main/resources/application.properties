spring.application.name=springbootbackend

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# =========================
# Kafka Configuration
# =========================
# Bootstrap servers for Kafka cluster.
# Prefer environment variable KAFKA_BOOTSTRAP_SERVERS, fallback to localhost:9092
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer group id (overridable via env var KAFKA_CONSUMER_GROUP_ID)
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:test-group}

# Key/value serializers and deserializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Example topic name to use for demo purposes (overridable via env var KAFKA_TEST_TOPIC)
app.kafka.test-topic=${KAFKA_TEST_TOPIC:test-topic}

# If you run without a Kafka broker, the app will still start, but sending will fail at runtime.
# Ensure a broker is available at the configured bootstrap-servers before testing.
